# Publish the website to GitHub Pages.
name: Publish personal website

on:
  push:
    paths:
      - "content/announcements/**"
      - "dist/**"
      - "build_announcements.py"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Prepare Python for announcement generation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install announcement builder
        run: python -m pip install 'PyYAML>=6,<7' 'lxml>=5,<7'
      - name: Generate announcement pages and lists
        run: python build_announcements.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
